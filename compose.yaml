x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  valkey:
    image: valkey/valkey:8.0.6-alpine
    container_name: valkey
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  nats_core:
    image: nats:2.10-alpine
    container_name: nats_core
    restart: unless-stopped
    command:
      - '-p'
      - '4222'
      - '-a'
      - '0.0.0.0'
      - '-m'
      - '8222'
      - '--auth=${NATS_AUTH_TOKEN:?Set NATS_AUTH_TOKEN in .env or environment}'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  nats_jetstream:
    image: nats:2.10-alpine
    container_name: nats_jetstream
    restart: unless-stopped
    command:
      - '-p'
      - '4223'
      - '-a'
      - '0.0.0.0'
      - '-m'
      - '8223'
      - '-js'
      - '--store_dir=/data'
      - '--auth=${NATS_AUTH_TOKEN:?Set NATS_AUTH_TOKEN in .env or environment}'
    volumes:
      - nats_jetstream_data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8223/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  fluxer_server:
    image: ${FLUXER_SERVER_IMAGE:-fluxer-self:latest}
    build:
      context: .
      dockerfile: fluxer_server/Dockerfile
      args:
        BASE_DOMAIN: ${BASE_DOMAIN:?Set BASE_DOMAIN in .env or environment (e.g. chat.yourdomain.com)}
        PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
        PUBLIC_PORT: ${PUBLIC_PORT:-443}
    container_name: fluxer_server
    restart: unless-stopped
    init: true
    environment:
      FLUXER_CONFIG: /usr/src/app/config/config.json
      NODE_ENV: production
    expose:
      - '8080'
    depends_on:
      valkey:
        condition: service_healthy
      nats_core:
        condition: service_healthy
      nats_jetstream:
        condition: service_healthy
    volumes:
      - ../files/config/config.json:/usr/src/app/config/config.json:ro
      - fluxer_data:/usr/src/app/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/_health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

volumes:
  valkey_data:
  nats_jetstream_data:
  fluxer_data:
