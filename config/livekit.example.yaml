port: 7880
bind_addresses: ['']

keys:
  '<replace-with-api-key>': '<replace-with-api-secret>'

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

turn:
  enabled: true
  udp_port: 3478

webhook:
  api_key: '<replace-with-api-key>'
  urls:
    - 'https://chat.example.com/api/webhooks/livekit'

room:
  auto_create: true
  max_participants: 50
  empty_timeout: 300
